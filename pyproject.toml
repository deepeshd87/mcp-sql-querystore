[project]
name = "mcp-sql-querystore"
version = "0.1.0"
description = "Read-only MCP server for SQL Server Query Store diagnostics"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "pyodbc>=5.1.0",
]

[project.scripts]
mcp-sql-querystore = "mcp_sql_querystore.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sql_querystore"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
